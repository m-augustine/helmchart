{{- range $.Values.timeouts }}
---
apiVersion: kuma.io/v1alpha1
kind: Timeout
mesh: {{ .mesh }}
metadata:
  name: {{ .name }}
spec:
  {{- with .sources }}
  sources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .destinations }}
  destinations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .conf }}
  conf:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
