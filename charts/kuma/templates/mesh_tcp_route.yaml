{{- range $.Values.meshTCPRoutes }}
{{- $destinationLabels := .destinationLabels }}
---
apiVersion: kuma.io/v1alpha1
kind: MeshTCPRoute
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    kuma.io/mesh: {{ .mesh }}
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: {{ $.Release.Name }}
    helm.sh/chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
spec:
  targetRef:
    {{- if .sourceLabels }}
    kind: Dataplane
    labels:
      {{- range $k, $v := .sourceLabels }}
      {{ $k }}: {{ $v }}
      {{- end }}
    {{- else }}
    kind: Mesh
    {{- end }}
  to:
    - rules:
      - default:
          backendRefs:
          {{- range  .destinationPorts }}
          - kind: MeshService
            labels:
              {{- range $k, $v := $destinationLabels }}
              {{ $k }}: {{ $v }}
              {{- end }}
            port: {{ . }}
            weight: 1
          {{- end}}
      targetRef:
        kind: MeshService
        labels:
          {{- range $k, $v := $destinationLabels }}
          {{ $k }}: {{ $v }}
          {{- end }}
{{- end }}
