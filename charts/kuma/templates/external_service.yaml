{{- range $.Values.externalServices }}
---
apiVersion: kuma.io/v1alpha1
kind: ExternalService
mesh: {{ .mesh }}
metadata:
  name: {{ .name }}
spec:
  tags:
    kuma.io/service: {{ .name }}
    kuma.io/protocol: {{ .protocol }} # optional, one of http, http2, tcp, grpc, kafka
  networking:
    address: {{ .address }}

{{- end }}