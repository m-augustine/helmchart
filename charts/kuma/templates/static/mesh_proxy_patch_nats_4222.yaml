{{- range $.Values.static.nats }}
---
apiVersion: kuma.io/v1alpha1
kind: MeshProxyPatch
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    description: NATS is server-speaks-first. Domain-matching MeshPassthroughs add
      tls_inspector/http_inspector to the outbound passthrough listeners, which wait
      for client bytes and stall NATS connections. Disable both inspectors for destination
      port 4222.
  labels:
    kuma.io/mesh: {{ .mesh }}
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: {{ $.Release.Name }}
    helm.sh/chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
spec:
  default:
    appendModifications:
    - listener:
        jsonPatches:
        - op: add
          path: /listenerFilters/1/filterDisabled
          value:
            destinationPortRange:
              end: 4223
              start: 4222
        - op: add
          path: /listenerFilters/2/filterDisabled
          value:
            destinationPortRange:
              end: 4223
              start: 4222
        match:
          name: self_transparentproxy_passthrough_outbound_ipv4
        operation: Patch
    - listener:
        jsonPatches:
        - op: add
          path: /listenerFilters/1/filterDisabled
          value:
            destinationPortRange:
              end: 4223
              start: 4222
        - op: add
          path: /listenerFilters/2/filterDisabled
          value:
            destinationPortRange:
              end: 4223
              start: 4222
        match:
          name: self_transparentproxy_passthrough_outbound_ipv6
        operation: Patch
  targetRef:
    {{- if .sourceLabels }}
    kind: Dataplane
    labels:
      {{- range $k, $v := .sourceLabels }}
      {{ $k }}: {{ $v }}
      {{- end }}
    {{- else }}
    kind: Mesh
    {{- end }}
{{- end }}
