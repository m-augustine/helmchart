{{- range $.Values.meshExternalServices }}
---
apiVersion: kuma.io/v1alpha1
kind: MeshExternalService
metadata:
  name: {{ .name }}
  namespace: kuma
  labels:
    kuma.io/mesh: {{ .mesh }}
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: {{ $.Release.Name }}
    helm.sh/chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
spec:
  match:
    port: {{ .port }}
    protocol: {{ .protocol }}
  endpoints:
  {{- with .endpoints }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
