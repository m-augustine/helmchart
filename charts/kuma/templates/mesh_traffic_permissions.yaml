{{- range $.Values.meshTrafficPermissions }}
apiVersion: kuma.io/v1alpha1
kind: MeshTrafficPermission
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    kuma.io/mesh: {{ .mesh }}
spec:
  targetRef:
    {{- if .externalServiceName }}
    kind: MeshExternalService
    name: {{ .externalServiceName }}
    {{- else }}
    kind: MeshSubset
    tags:
      {{- toYaml .destination | nindent 6 }}
    {{- end }}
  from:
  {{- range .sources }}
  - targetRef:
      kind: MeshSubset
      tags:
        {{- toYaml . | nindent 8 }}
    default:
      action: Allow
  {{- end }}
---
{{- end }}
