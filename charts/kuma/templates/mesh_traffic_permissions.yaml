{{- range $.Values.meshTrafficPermissions }}
---
apiVersion: kuma.io/v1alpha1
kind: MeshTrafficPermission
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    kuma.io/mesh: {{ .mesh }}
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: {{ $.Release.Name }}
    helm.sh/chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
spec:
  targetRef:
    kind: Dataplane
    labels:
      {{- range $k, $v := .targetLabels }}
      {{ $k }}: {{ $v }}
      {{- end }}
  rules:
    - default:
        allow:
          {{- range .allowSpiffeIDs }}
          - spiffeID:
              type: Exact
              value: {{ . }}
          {{- end }}
{{- end }}
