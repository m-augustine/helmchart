{{- range $name, $item := $.Values.meshTrafficPermissions }}
apiVersion: kuma.io/v1alpha1
kind: MeshTrafficPermission
metadata:
  name: {{ $item.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    kuma.io/mesh: {{ $item.mesh }}
spec:
  targetRef:
    kind: MeshSubset
    tags:
      {{- toYaml $item.destination | nindent 6 }}
  from:
  {{- range $item.sources }}
  - targetRef:
      kind: MeshSubset
      tags:
        {{- toYaml . | nindent 8 }}
    default:
      action: Allow
  {{- end }}
---
{{- end }}
