{{- range $.Values.meshTrafficPermissions }}
apiVersion: kuma.io/v1alpha1
kind: MeshTrafficPermission
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    kuma.io/mesh: {{ .mesh }}
spec:
  targetRef:
    kind: MeshSubset
    tags:
      {{- if .externalServiceName }}
      kuma.io/service: {{ .externalServiceName }}_kuma_extsvc
      {{- else }}
      {{- toYaml .destination | nindent 6 }}
      {{- end }}
  from:
  {{- range .sources }}
  - targetRef:
      kind: MeshSubset
      tags:
        {{- toYaml . | nindent 8 }}
    default:
      action: Allow
  {{- end }}
---
{{- end }}
