{{- range $.Values.meshTrafficPermissions }}
---
apiVersion: kuma.io/v1alpha1
kind: MeshTrafficPermission
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    kuma.io/mesh: {{ .mesh }}
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: {{ $.Release.Name }}
    helm.sh/chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
spec:
  targetRef:
    {{- if .destination }}
    kind: Dataplane
    labels:
      {{- range $k, $v := .destination }}
      {{ $k }}: {{ $v }}
      {{- end }}
    {{- else }}
    kind: Mesh
    {{- end }}
  from:
    {{- range .sources }}
    - targetRef:
        kind: MeshSubset
        tags:
          {{- range $k, $v := . }}
          {{ $k }}: {{ $v }}
          {{- end }}
      default:
        action: Allow
    {{- end }}
{{- end }}
