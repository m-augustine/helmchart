{{- range $.Values.rateLimits }}
apiVersion: kuma.io/v1alpha1
kind: RateLimit
mesh: {{ .mesh }}
metadata:
  name: {{ .name }}
spec:
  {{- with .sources }}
  sources:
    {{- toYaml . | nindent 6 }}
  {{- end }}
  {{- with .destinations }}
  destinations:
    {{- toYaml . | nindent 6 }}
  {{- end }}
  {{- with .conf }}
  conf:
    {{- toYaml . | nindent 6 }}
  {{- end }}
---
{{- end }}