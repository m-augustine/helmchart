{{- range $.Values.meshes }}
---
apiVersion: kuma.io/v1alpha1
kind: Mesh
metadata:
  name: {{ .name }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .networking }}
  networking:
    outbound:
      passthrough: {{ .networking.outbound.passthrough }}
  {{- end }}
  {{- if .mtls }}
  mtls:
    enabledBackend: {{ .mtls.enabledBackend }}
    {{- with .mtls.backends }}
    backends:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- if .tracing }}
  tracing:
    defaultBackend: {{ .tracing.defaultBackend }}
    {{- with .tracing.backends }}
    backends:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- if .logging }}
  logging:
    defaultBackend: {{ .logging.defaultBackend }}
    {{- with .logging.backends }}
    backends:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- if .metrics }}
  metrics:
    enabledBackend: {{ .metrics.enabledBackend }}
    {{- with .metrics.backends }}
    backends:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- if .meshServices }}
  meshServices:
    mode: {{ .meshServices.mode }}
  {{- end }}
{{- end }}
