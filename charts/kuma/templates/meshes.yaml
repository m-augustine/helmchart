{{- range $.Values.meshes }}
---
apiVersion: kuma.io/v1alpha1
kind: Mesh
metadata:
  name: {{ .name }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .networking }}
  networking:
    outbound:
      passthrough: {{ .networking.outbound.passthrough }}
  {{- end }}
  {{- if .mtls }}
  mtls:
    enabledBackend: {{ .mtls.enabledBackend }}
    {{- with .mtls.backends }}
    backends:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- if .tracing }}
  tracing:
    defaultBackend: {{ .tracing.defaultBackend }}
    {{- with .tracing.backends }}
    backends:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- if .logging }}
  logging:
    defaultBackend: {{ .logging.defaultBackend }}
    {{- with .logging.backends }}
    backends:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- if .metrics }}
  metrics:
    enabledBackend: {{ .metrics.enabledBackend }}
    {{- with .metrics.backends }}
    backends:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
---
apiVersion: kuma.io/v1alpha1
kind: MeshIdentity
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    kuma.io/mesh: {{ .name }}
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: {{ $.Release.Name }}
    helm.sh/chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
spec:
  spiffeID:
    trustDomain: {{ .name }}
  provider:
    type: Bundled
    bundled:
      autogenerate:
        enabled: true
      meshTrustCreation: Enabled
{{- end }}
