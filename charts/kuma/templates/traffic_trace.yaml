{{- range $.Values.trafficTraces }}
apiVersion: kuma.io/v1alpha1
kind: TrafficTrace
mesh: {{ .mesh }}
metadata:
  name: {{ .name }}
spec:
  {{- with .selectors }}
  selectors:
    {{- toYaml . | nindent 6 }}
  {{- end }}
  {{- with .conf }}
  conf:
    {{- toYaml . | nindent 6 }}
  {{- end }}
---
{{- end }}