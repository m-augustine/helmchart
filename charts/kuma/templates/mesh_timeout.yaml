{{- range $.Values.meshTimeouts }}
---
apiVersion: kuma.io/v1alpha1
kind: MeshTimeout
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    kuma.io/mesh: {{ .mesh }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- toYaml .spec | nindent 2 }}
{{- end }}
