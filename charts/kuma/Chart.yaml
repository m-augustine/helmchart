#0.5.6 - Replace MeshExternalService with MeshPassthrough for external service connectivity
#0.5.7 - MeshTrafficPermission targetRef uses MeshService (Kuma 3.0 drops MeshSubset support)
#3.0.1 - MeshTrafficPermission rewritten for Kuma 3.0 schema: Mesh targetRef + SPIFFE prefix allow
#3.0.2 - Add MeshIdentity template; remove deprecated Mesh.mtls and Mesh.meshServices
#3.0.0 - for v3 kuma