apiVersion: v1
description: A Helm chart for Kuma Resources
name: kuma-resources
type: application
version: 3.0.2

####
#0.1.0 - initial release
#0.2.0 - several additions
#0.3.0 - TrafficRoutes
#0.4.2 - Support new Mesh resources
#0.4.3 - Fix MeshTrafficPermission missing default.action; fix MeshExternalService missing match.port; fix toYaml nindent
#0.5.0 - Add Timeout and MeshTimeout templates
#0.5.1 - Clean up teamplates
#0.5.2 - MeshExternalService must be in kuma system namespace
