{{- range $item := $.Values.persistence }}
---
{{- if $item.enabled }}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ default (printf "%s-%s" (include "app.fullname" $) $item.name) $item.fullName }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  {{- if $item.storageClass }}
  storageClassName: {{ $item.storageClass | quote | default "" }}
  {{- end }}
  accessModes:
    - {{ $item.accessMode | quote }}
  resources:
    requests:
      storage: {{ $item.size | quote }}

{{- end }}
{{- end }}